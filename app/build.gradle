plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rs118.datavault'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rs118.datavault'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly project(':xposed-api')
}
